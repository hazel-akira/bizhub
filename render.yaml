# Render blueprint — Laravel API (not Flutter web).
# Dashboard: New → Blueprint → connect repo, or match these settings manually.
#
# Flutter web uses the root Dockerfile.web — do NOT use that for the Play Store API.

services:
  - type: web
    name: akira-flow-api
    runtime: docker
    rootDir: services/api
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /up
    # Render sets PORT=10000; entrypoint.sh configures nginx to listen on $PORT.
    envVars:
      - key: APP_NAME
        value: Akira Bites API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://akira-flow-api.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: false
      - key: SESSION_PATH
        value: /
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: MAIL_MAILER
        value: log
      - key: MPESA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      - key: MPESA_CALLBACK_URL
        value: https://akira-flow-api.onrender.com/api/payments/stk-callback
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: RUN_MIGRATIONS
        value: true
      - key: RUN_SEEDER
        value: false
