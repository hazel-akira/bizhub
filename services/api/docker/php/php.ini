; Production PHP settings for Laravel API
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 10M
post_max_size = 12M
max_input_vars = 3000

; Error handling — log only in production
display_errors = Off
display_startup_errors = Off
log_errors = On

; Timezone (override via TZ env if needed)
date.timezone = UTC

; Realpath cache improves performance with many includes
realpath_cache_size = 4096K
realpath_cache_ttl = 600
