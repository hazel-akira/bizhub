[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Queue worker disabled — app has no queued jobs (M-Pesa events broadcast synchronously).
# If you set QUEUE_CONNECTION=database, uncomment and ensure DB SSL env is clean (see entrypoint.sh).
; [program:laravel-worker]
; process_name=%(program_name)s_%(process_num)02d
; command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --no-interaction
; autostart=true
; autorestart=true
; stopwaitsecs=3600
; user=www-data
; numprocs=1
; priority=30
; environment=HOME="/var/www",PGSSLMODE="require"
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
