# fly.toml — Akira Flow Laravel API
# Deploy from this directory: cd services/api && fly launch --copy-config

app = "akira-flow-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"
  method = "GET"
  path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
